<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#28211f" />
    <title>Tjap Kemiri</title>
    <link rel="icon" href="/Logo/Logo%20tjap%20kemiri.png" />
    <link rel="stylesheet" href="/app/splash-preview.css?v=6" />
  </head>
  <body>
    <main class="preview-shell" aria-label="Animasi pembuka Tjap Kemiri">
      <section class="splash-stage" id="splash-stage">
        <div class="light-reveal" aria-hidden="true"></div>
        <div class="brand-reveal">
          <div class="brand-lockup">
            <img
              src="/Logo/Logo%20tjap%20kemiri.png"
              alt="Tjap Kemiri"
              class="brand-logo"
            />
          </div>
        </div>

        <div class="barista-track" aria-hidden="true">
          <img
            class="barista"
            src="/app/assets/barista-push.png?v=1"
            alt=""
          />
        </div>

        <div class="stage-footer">
          <button class="skip-button" id="skip-button" type="button">Lewati</button>
        </div>
      </section>

    </main>
    <script src="/app/splash-preview.js?v=3"></script>
  </body>
</html>
